name: Compiler v2

on:
  push:
    branches: [feat/compilerv2-expression-lowering, main]
    paths: ['compilerv2/**', '.github/workflows/compilerv2.yml']
  pull_request:
    paths: ['compilerv2/**', '.github/workflows/compilerv2.yml']

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: compilerv2/go.mod
          cache-dependency-path: compilerv2/go.sum
      - name: Check compiler v2
        shell: bash
        run: go -C compilerv2 test ./... -count=1 -json | tee proof-results.json
      - name: Keep expression-site results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expression-site-results
          path: proof-results.json
