name: Compiler v2

on:
  push:
    branches: [main]
    paths: ['compilerv2/**', '.github/workflows/compilerv2.yml']
  pull_request:
    paths: ['compilerv2/**', '.github/workflows/compilerv2.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: compilerv2/go.mod
          cache-dependency-path: compilerv2/go.sum
      - name: Test compiler v2
        run: go -C compilerv2 test ./...
