name: Formatter corpus CI

on:
  pull_request:
    paths:
      - ".github/workflows/formatter-ci.yml"
      - ".github/workflows/slow-ci.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "cmd/tgofmt/**"
      - "pkg/format/**"
      - "pkg/syntax/**"
      - "scripts/check_formatter_boundary.py"
      - "scripts/check_formatter_ci_paths.py"
      - "scripts/check_generated.py"
  workflow_dispatch:

concurrency:
  group: formatter-corpus-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatter-go-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make formatter-go-corpus
