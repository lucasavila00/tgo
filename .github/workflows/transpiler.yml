name: TGo transpiler

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: transpiler/go.mod
          cache-dependency-path: transpiler/go.sum
      - name: Test transpiler
        run: go -C transpiler test ./...
