name: TGo transpiler

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build fixture outputs and check snapshots
        run: go test ./tests -run ^TestPropagationFixtures$ -count=1
      - name: Test transpiler
        run: go test ./...
