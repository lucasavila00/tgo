name: Slow CI

on:
  pull_request:
    paths:
      - ".github/workflows/slow-ci.yml"
      - "Makefile"
      - "cmd/tgofmt/**"
      - "pkg/format/**"
      - "pkg/syntax/**"
      - "scripts/check_formatter_boundary.py"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make slow-ci
